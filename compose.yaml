# docker compose up --build   ->  shop on http://localhost:8000, admin on /admin/
x-django-env: &django-env
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
  POSTGRES_HOST: db
  POSTGRES_DB: ${POSTGRES_DB:-didostati}
  POSTGRES_USER: ${POSTGRES_USER:-didostati}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-didostati}
  REDIS_URL: redis://redis:6379

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-didostati}
      POSTGRES_USER: ${POSTGRES_USER:-didostati}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-didostati}
    volumes:
      - postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"  # for running Django outside Docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Saved to disk so login tokens survive a restart.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis:/data
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: .
    environment: *django-env
    volumes:
      - media:/app/backend/media
      - static:/app/backend/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media:/srv/media:ro
      - static:/srv/static:ro
    ports:
      - "${HTTP_PORT:-8000}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres:
  redis:
  media:
  static:
