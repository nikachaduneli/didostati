server {
    listen 80;
    client_max_body_size 20m;

    location /static/ {
        alias /srv/static/;
        expires 7d;
    }

    location /media/ {
        alias /srv/media/;
        expires 7d;
    }

    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
