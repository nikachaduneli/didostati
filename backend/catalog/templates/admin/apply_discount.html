{% extends "admin/base_site.html" %}

{% block content %}
    <p>Apply a bulk discount to the selected products:</p>

    <form action="" method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <input type="hidden" name="action" value="apply_discount" />

        {% for obj in queryset %}
            <input type="hidden" name="_selected_action" value="{{ obj.pk }}">
        {% endfor %}

        <input type="submit" name="apply" value="Apply Discount" class="default" />
    </form>
{% endblock %}
